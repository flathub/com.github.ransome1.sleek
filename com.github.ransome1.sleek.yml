app-id: com.github.ransome1.sleek
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: sleek
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.FileChooser
  # Tray icon on Wayland
  - --talk-name=org.kde.StatusNotifierWatcher
  # Ensure correct cursor size on Wayland
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node20
modules:
  - name: sleek
    buildsystem: simple
    build-commands:
      - ar x com.github.ransome1.sleek.deb
      - tar -xf data.tar.* -C /app
      - find /app/opt/sleek/ -exec chmod -R a-s,go+rX,go-w {} \;
      - install -Dm755 sleek-entrypoint.sh /app/bin/sleek
      - install -Dm644 ./resources/icon.iconset/icon_128x128.png /app/share/icons/hicolor/128x128/apps/com.github.ransome1.sleek.png
      - install -Dm644 ./resources/icon.iconset/icon_256x256.png /app/share/icons/hicolor/256x256/apps/com.github.ransome1.sleek.png
      - install -Dm644 ./resources/icon.iconset/icon_512x512.png /app/share/icons/hicolor/512x512/apps/com.github.ransome1.sleek.png
      - install -Dm644 flatpak/com.github.ransome1.sleek.desktop /app/share/applications/com.github.ransome1.sleek.desktop
      - install -Dm644 flatpak/com.github.ransome1.sleek.appdata.xml /app/share/metainfo/com.github.ransome1.sleek.appdata.xml
    sources:
      - type: git
        url: https://github.com/ransome1/sleek.git
        commit: 41c903343bd2d26c58152273de73af1e27e692c4
      - type: script
        dest-filename: sleek-entrypoint.sh
        commands:
          - |
            #!/bin/bash
            export TMPDIR="${XDG_CACHE_HOME:-/tmp}"
            if [ -n "$WAYLAND_DISPLAY" ] && [ "$XDG_SESSION_TYPE" = "wayland" ]; then
              exec zypak-wrapper /app/opt/sleek/sleek --ozone-platform=wayland "$@"
            else
              exec zypak-wrapper /app/opt/sleek/sleek "$@"
            fi
      - type: file
        dest-filename: com.github.ransome1.sleek.deb
        url: https://github.com/ransome1/sleek/releases/download/v2.1.1/sleek-2.1.1-linux-arm64.deb
        sha256: 1dbfacc69c006d5ca3421ed8ab4328a6fcece4be4ddcb2e38ef170a624084c3c
        only-arches:
          - aarch64          
      - type: file
        dest-filename: com.github.ransome1.sleek.deb
        url: https://github.com/ransome1/sleek/releases/download/v2.1.1/sleek-2.1.1-linux-amd64.deb
        sha256: fce4ac3a0d911aa03e3d0cd01727e560a29e9281fcb23b13dbefbd870b9e2f80
        only-arches:
          - x86_64
